<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <style>
    :root {
      --text: #1f1f1f;
      --muted: #5f5e5a;
      --line: #e6e5e1;
      --accent: #2a78d6;
      --bg: #fcfcfb;
      --code-bg: #f3f2ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
    .topnav { display: flex; gap: 20px; font-size: 15px; margin-bottom: 48px; }
    .topnav a { color: var(--muted); text-decoration: none; }
    .topnav a:hover { color: var(--accent); }
    h1 { font-size: 2.1em; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 1.4em; margin-top: 2.2em; }
    h3 { font-size: 1.15em; margin-top: 1.8em; }
    .meta { color: var(--muted); font-size: 15px; margin-bottom: 40px; }
    a { color: var(--accent); }
    img { max-width: 100%; height: auto; display: block; margin: 24px auto; }
    blockquote { margin: 24px 0; padding: 4px 20px; border-left: 3px solid var(--line); color: var(--muted); }
    table { border-collapse: collapse; margin: 24px 0; font-size: 16px; }
    th, td { border-bottom: 1px solid var(--line); padding: 6px 14px; text-align: left; }
    th { font-weight: 600; }
    code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; font-size: 0.88em; }
    pre { background: var(--code-bg); padding: 16px; border-radius: 6px; overflow-x: auto; line-height: 1.5; }
    pre code { background: none; padding: 0; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .post-list a { font-size: 1.15em; font-weight: 600; text-decoration: none; }
    .post-list .date { display: block; color: var(--muted); font-size: 15px; }
    .post-list .excerpt { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav">
      <a href="{{ '/' | relative_url }}">{{ site.name }}</a>
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
    </nav>
    <article>
      <h1>{{ page.title }}</h1>
      {% if page.date %}<div class="meta">{{ page.date | date: "%B %-d, %Y" }}</div>{% endif %}
      {{ content }}
    </article>
  </div>
</body>
</html>
